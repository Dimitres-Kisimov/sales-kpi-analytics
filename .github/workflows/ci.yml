name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling and optional deps
        run: python -m pip install --upgrade pip ruff pytest openpyxl matplotlib python-pptx

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Generate the dataset
        run: python scripts/generate_data.py

      - name: Write the deliverables
        run: python -m saleskpi --deliverables

      - name: Run the SQL cross-check queries
        run: python -m saleskpi --sql

      - name: Build the executive review
        run: python scripts/make_presentation.py

      - name: Refresh the dashboard data bundle
        run: python scripts/build_web_data.py

      - name: Validate the deliverables exist and analysis.json parses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = Path("deliverables")
          required = [
              "analysis.json", "management_report.md", "reorder_list.csv",
              "kpi_workbook.xlsx", "forecast.png", "executive_review.pdf",
          ]
          missing = [f for f in required if not (d / f).exists()]
          assert not missing, f"missing deliverables: {missing}"

          data = json.loads((d / "analysis.json").read_text(encoding="utf-8"))
          for key in ("kpi", "revenue_forecast", "abc_xyz", "expenditure", "decision_cards"):
              assert key in data, f"analysis.json missing key: {key}"
          assert (Path("web") / "data.js").exists(), "web/data.js not built"
          print("deliverables OK:", ", ".join(required))
          PY
