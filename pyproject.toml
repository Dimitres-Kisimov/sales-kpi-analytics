[project]
name = "sales-kpi-analytics"
version = "0.1.0"
description = "Distributor sales & demand analytics — KPIs, ABC-XYZ, RFM, margin bridge, out-of-sample-validated forecasting, safety stock, and a from-scratch dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dimitres Kisimov" }]
keywords = ["analytics", "kpi", "forecasting", "inventory", "abc-xyz", "rfm", "business-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
saleskpi = "saleskpi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saleskpi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
